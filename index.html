<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EduGenie — AI Learning Assistant</title>
  <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
</head>
<body>
  <header class="hero">
    <div class="hero-inner">
      <div class="badge">AI LEARNING ASSISTANT</div>
      <h1>Edu<span>Genie</span></h1>
      <p>Ask, understand, practice, summarize, and plan your learning with AI.</p>
    </div>
  </header>

  <main class="container">
    <section class="card">
      <label for="task">Choose a task</label>
      <select id="task">
        <option value="qa">Ask a Question</option>
        <option value="explain">Explain a Concept</option>
        <option value="quiz">Generate a Quiz</option>
        <option value="summarize">Summarize Text</option>
        <option value="learn">Learning Path</option>
      </select>

      <label id="level-label" for="level" class="hidden">Learner level</label>
      <select id="level" class="hidden">
        <option>Beginner</option>
        <option>Intermediate</option>
        <option>Advanced</option>
      </select>

      <label for="inputText">Your input</label>
      <textarea id="inputText" rows="10" placeholder="Type your question, topic, or passage here..."></textarea>
      <div class="actions">
        <button id="submitBtn">Generate</button>
        <button id="clearBtn" class="secondary">Clear</button>
      </div>
    </section>

    <section id="resultCard" class="card result-card hidden">
      <div class="result-heading">
        <h2>Result</h2>
        <button id="copyBtn" class="secondary small">Copy</button>
      </div>
      <div id="result"></div>
    </section>
  </main>

  <footer>EduGenie • FastAPI + Google Gemini</footer>
  <script src="{{ url_for('static', path='app.js') }}"></script>
</body>
</html>
